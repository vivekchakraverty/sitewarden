name: Release

# Push a tag like v0.2.0 (matching package.json "version") to build and publish
# Windows, macOS and Linux installers. Run it by hand with an existing tag to
# rebuild and replace that release's installers.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build, e.g. v0.2.0'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    name: Check version and create release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Tag must match package.json version
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$v" -ne $env:TAG) { throw "Tag $env:TAG does not match package.json version $v" }
      - name: Create the release if it doesn't exist
        shell: pwsh
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) { "Release $env:TAG exists; installers will be replaced." >> $env:GITHUB_STEP_SUMMARY; exit 0 }
          $v = $env:TAG.TrimStart('v')
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## $([regex]::Escape($v))\b.*?(?=^## |\z)")
          $section = if ($m.Success) { $m.Value.Trim() } else { "SiteWarden $v" }
          @"
          $section

          ## Downloads

          | Platform | File |
          |---|---|
          | Windows 10/11 (x64) | ``SiteWarden-Setup-$v.exe`` |
          | macOS, Apple Silicon | ``SiteWarden-$v-mac-arm64.dmg`` |
          | macOS, Intel | ``SiteWarden-$v-mac-x64.dmg`` |
          | Linux (x64) | ``SiteWarden-$v-linux-x86_64.AppImage`` or ``SiteWarden-$v-linux-amd64.deb`` |

          Each file has a matching ``.sha256``. The builds aren't code-signed yet; see the README's install section for the one-time steps on each OS.
          "@ | Out-File -Encoding utf8 notes.md
          gh release create $env:TAG --title "SiteWarden $v" --notes-file notes.md --verify-tag
          exit $LASTEXITCODE

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, flag: --win }
          - { name: macos, os: macos-latest, flag: --mac }
          - { name: linux, os: ubuntu-latest, flag: --linux }
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx electron-builder ${{ matrix.flag }} --publish never
      - name: Upload installers and checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem release -File | Where-Object { $_.Name -match '^SiteWarden-.*\.(exe|dmg|AppImage|deb)$' }
          if (-not $files) { throw 'no installers found in release/' }
          $upload = @()
          foreach ($f in $files) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($f.Name)" | Out-File -Encoding ascii "$($f.FullName).sha256"
            $upload += $f.FullName, "$($f.FullName).sha256"
            "**$($f.Name)**: SHA-256 ``$h``" >> $env:GITHUB_STEP_SUMMARY
          }
          gh release upload $env:TAG @upload --clobber
          exit $LASTEXITCODE
